[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "x402aff"
version = "0.2.0"
description = "Builder-code affiliation for x402 sellers - route each payment to a per-(seller, builder) 0xSplits split."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["x402", "builder-codes", "0xsplits", "base", "affiliation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
    "cbor2>=5.4",
    # EIP-55 for the predicted split address, which goes straight into the 402 as
    # payTo: a web3.py-based facilitator rejects a non-checksummed recipient. This
    # is the one thing here that needs keccak, and it has to be deterministic - a
    # lazily-imported optional would leave a minimal install silently emitting the
    # lowercase form and hitting exactly the bug this prevents. Costs a real seller
    # nothing: x402[evm] already pulls it in via eth-account.
    "eth-utils>=2.0",
    # eth-hash ships with NO keccak backend by default, and eth-utils does not
    # pick one - so `to_checksum_address` raises unless a backend is present.
    # Naming it here is what makes the checksum actually happen on a clean
    # install; without it CI silently produced lowercase addresses.
    "eth-hash[pycryptodome]>=0.3.1",
]

[project.optional-dependencies]
# Discovery via the CDP SQL API: monitor.py, Affiliation.scan/pending/splits_payload.
cdp = ["cdp-sdk>=1.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/MiroShark/x402aff"
Repository = "https://github.com/MiroShark/x402aff"
Documentation = "https://github.com/MiroShark/x402aff/blob/main/docs/INTEGRATION.md"
Issues = "https://github.com/MiroShark/x402aff/issues"

[tool.setuptools]
packages = ["x402aff"]

[tool.setuptools.package-data]
# Ship the reference queries alongside the code they document, and the PEP 561
# marker so a consumer's type checker sees the annotations.
x402aff = ["queries.sql", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
