name: Release

# Publishes both packages - PyPI `x402aff` (python/) and npm `x402aff` (ts/) -
# from one tag. Bump both versions to match the tag, then:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# One-time setup, per registry:
#
#   PyPI  - currently the repo secret `PYPI_API_TOKEN` (account-scoped, owner
#           `aaronjmars`). Trusted publishing is better and needs no secret: on
#           https://pypi.org/manage/account/publishing/, signed in as the account
#           that should own the project (a personal one is fine - no PyPI org
#           needed), add a publisher for project `x402aff`, owner `MiroShark`,
#           repo `x402aff`, workflow `release.yml`, environment `pypi`. The
#           `owner`/`repo` there are GitHub coordinates, unrelated to who owns
#           the project on PyPI. Once it exists, drop the `password:` line below
#           and delete the secret - `id-token: write` already covers OIDC.
#   npm   - OIDC trusted publishing, no token. Configured on npmjs.com (package
#           Settings -> Trusted Publisher) for owner `MiroShark`, repo `x402aff`,
#           workflow `release.yml` (must match this file's name), environment
#           blank. Provenance is on via publishConfig + `id-token: write`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Which registry to publish to
        type: choice
        options: [both, pypi, npm]
        default: both

jobs:
  pypi:
    if: ${{ github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'pypi' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]' build twine
        working-directory: python
      - id: version
        name: Read the version, and check whether PyPI already has it
        working-directory: python
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -fsS -o /dev/null "https://pypi.org/pypi/x402aff/$VERSION/json"; then
            echo "PyPI already has x402aff $VERSION - will build and check, but not upload."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: A tag must match the version it claims to release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          test "v${{ steps.version.outputs.version }}" = "${GITHUB_REF#refs/tags/}"
      - run: pytest
        working-directory: python
      - run: python -m build
        working-directory: python
      - run: twine check python/dist/*
      # Skipping the upload rather than the whole job keeps a re-run of an
      # already-published version honest: it still builds and validates.
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.version.outputs.published == 'false'
        with:
          packages-dir: python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}

  npm:
    if: ${{ github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'npm' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance attestation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
        working-directory: ts
      - id: version
        name: Read the version, and check whether npm already has it
        working-directory: ts
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "x402aff@$VERSION" version > /dev/null 2>&1; then
            echo "npm already has x402aff $VERSION - will typecheck, test and build, but not publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: A tag must match the version it claims to release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          test "v${{ steps.version.outputs.version }}" = "${GITHUB_REF#refs/tags/}"
      # Explicit, so a run that skips the publish below still validates the tree.
      # `prepublishOnly` repeats them as the guard for a local `npm publish`.
      - run: npm run typecheck
        working-directory: ts
      - run: npm test
        working-directory: ts
      - run: npm run build
        working-directory: ts
      # Auth via OIDC trusted publishing (configured on npmjs.com) — no token
      - run: npm publish
        if: steps.version.outputs.published == 'false'
        working-directory: ts
