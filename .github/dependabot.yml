version: 2
updates:
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /ts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep types at the lowest Node line CI tests (engines >=20, CI on 22/24)
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
